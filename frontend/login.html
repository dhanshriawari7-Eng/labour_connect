<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Labour Connect</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        primary: '#F97316',
                        'primary-hover': '#EA580C',
                        darkbg: '#0B0F19',
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0F19; color: #E2E8F0; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255, 255, 255, 0.15); border-left: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); }
        .input-glass { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
        .input-glass:focus { background: rgba(0, 0, 0, 0.4); border-color: #F97316; outline: none; box-shadow: 0 0 15px rgba(249, 115, 22, 0.2); }
        .glow-button { box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); transition: all 0.3s ease; }
        .glow-button:hover { box-shadow: 0 0 30px rgba(249, 115, 22, 0.7); transform: scale(1.02); }
    </style>
</head>
<body class="font-sans antialiased selection:bg-primary selection:text-white min-h-screen flex items-center justify-center relative p-4">

    <!-- Animated Background Blobs -->
    <div class="absolute top-1/4 -left-20 w-96 h-96 bg-primary rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob z-0 pointer-events-none"></div>
    <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob animation-delay-2000 z-0 pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        
        <!-- Logo -->
        <a href="index.html" class="flex items-center justify-center gap-3 mb-8 hover:opacity-80 transition-opacity">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-primary to-orange-400 flex items-center justify-center text-white shadow-[0_0_20px_rgba(249,115,22,0.4)]">
                <i class="fa-solid fa-helmet-safety text-xl"></i>
            </div>
            <span class="text-2xl font-bold text-white tracking-tight">Labour<span class="text-primary">Connect</span></span>
        </a>

        <div class="glass-card rounded-3xl p-8 w-full">
            
            <div class="flex justify-between mb-8 border-b border-white/10 pb-4">
                <button id="tab-login" class="text-lg font-bold text-primary px-2 transition-colors focus:outline-none" onclick="toggleAuthForm('login')">Sign In</button>
                <button id="tab-register" class="text-lg font-bold text-slate-500 hover:text-slate-300 px-2 transition-colors focus:outline-none" onclick="toggleAuthForm('register')">Create Account</button>
            </div>

            <div id="loginError" class="hidden mb-6 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-xl p-4 font-medium backdrop-blur-md flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i> <span></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="login(event)" class="space-y-5 animate-[fadeIn_0.3s_ease-out]">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="email" name="email" class="input-glass w-full rounded-xl pl-12 pr-4 py-3.5 text-sm" placeholder="you@example.com" required>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-xs text-primary hover:text-primary-hover transition-colors font-medium">Forgot?</a>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="password" name="password" class="input-glass w-full rounded-xl pl-12 pr-4 py-3.5 text-sm" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-primary-hover text-white py-3.5 rounded-xl font-bold text-base transition-all glow-button mt-4">
                    Sign In to Dashboard
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" onsubmit="register(event)" class="hidden space-y-4 animate-[fadeIn_0.3s_ease-out]">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Full Name</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="text" name="name" class="input-glass w-full rounded-xl pl-12 pr-4 py-3.5 text-sm" placeholder="John Doe" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="email" name="email" class="input-glass w-full rounded-xl pl-12 pr-4 py-3.5 text-sm" placeholder="you@example.com" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="password" name="password" class="input-glass w-full rounded-xl pl-12 pr-4 py-3.5 text-sm" placeholder="••••••••" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">I want to</label>
                    <div class="relative">
                        <i class="fa-solid fa-briefcase absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <select name="role" class="input-glass w-full rounded-xl pl-12 pr-4 py-3.5 text-sm appearance-none" required>
                            <option value="CLIENT" class="bg-darkbg">Post jobs & hire</option>
                            <option value="LABOURER" class="bg-darkbg">Find work (Labourer)</option>
                            <option value="CONTRACTOR" class="bg-darkbg">Find work (Contractor)</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none text-xs"></i>
                    </div>
                </div>
                <button type="submit" class="w-full bg-white text-darkbg hover:bg-gray-200 py-3.5 rounded-xl font-bold text-base transition-all shadow-[0_0_20px_rgba(255,255,255,0.2)] mt-4">
                    Create Account
                </button>
            </form>
        </div>
        
        <p class="text-center text-slate-500 text-sm mt-8 font-light">
            By continuing, you agree to our <a href="#" class="text-white hover:text-primary transition-colors underline decoration-white/20">Terms of Service</a>.
        </p>
    </div>

    <script src="js/api.js?v=3"></script>
    <script src="js/auth.js?v=3"></script>
    <script>
        function toggleAuthForm(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const errorDiv = document.getElementById('loginError');

            if (errorDiv) errorDiv.classList.add('hidden');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = 'text-lg font-bold text-primary px-2 transition-colors focus:outline-none';
                tabRegister.className = 'text-lg font-bold text-slate-500 hover:text-slate-300 px-2 transition-colors focus:outline-none';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = 'text-lg font-bold text-primary px-2 transition-colors focus:outline-none';
                tabLogin.className = 'text-lg font-bold text-slate-500 hover:text-slate-300 px-2 transition-colors focus:outline-none';
            }
        }

        if (window.location.search.includes('register=true')) {
            toggleAuthForm('register');
        }
        
        // Show errors correctly
        const originalErrorShow = document.getElementById('loginError');
        if (originalErrorShow) {
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.type === 'childList' && mutation.target.innerText) {
                        mutation.target.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>${mutation.target.innerText}</span>`;
                    }
                });
            });
            observer.observe(originalErrorShow, { childList: true });
        }
    </script>
</body>
</html>
